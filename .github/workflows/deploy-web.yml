name: Test engine, build firmware and deploy browser terminal
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platformio:
    name: PlatformIO (${{ matrix.environment }})
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [native, esp32dev]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - if: matrix.environment == 'native'
        run: pio test -e native
      - if: matrix.environment == 'native'
        run: python3 sim/test_cli.py
      - name: Test math tooling and serial monitor
        if: matrix.environment == 'native'
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - if: matrix.environment == 'esp32dev'
        run: pio run -e esp32dev

  build:
    name: Build and test browser terminal
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event.deleted != true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: 15915cad554b707837024dc2758b6a1c5b94b036 # 4.0.22
          path: .emsdk-build
          persist-credentials: false
      - run: ./.emsdk-build/emsdk install 4.0.22 && ./.emsdk-build/emsdk activate 4.0.22
      - run: npm ci && npm run build
        env:
          EMXX: ${{ github.workspace }}/.emsdk-build/upstream/emscripten/em++
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npx --no-install playwright-core install --with-deps chromium
        working-directory: web
      - run: npm run test:browser
        working-directory: web
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: web/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [platformio, build]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
