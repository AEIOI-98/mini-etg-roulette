[platformio]
default_envs = native
core_dir = .pio-core

[env:native]
platform = native@1.2.1
test_framework = unity
lib_deps =
    mini-etg-core=symlink://core
    mini-etg-sim=symlink://sim/shared
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -pedantic
    -fno-exceptions
    -fno-rtti
    -Itest/support

