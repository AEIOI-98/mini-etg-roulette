[platformio]
default_envs = native
core_dir = .pio-core

[env:native]
platform = native@1.2.1
test_framework = unity
extra_scripts = pre:tools/native_build.py
lib_deps =
    mini-etg-core=symlink://core
    mini-etg-sim=symlink://sim/shared
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -pedantic
    -Itest/support

