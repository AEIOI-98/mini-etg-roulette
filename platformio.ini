[platformio]
default_envs = native
src_dir = firmware/src
core_dir = .pio-core

[env:native]
platform = native@1.2.1
test_build_src = yes
build_src_filter = +<nvs_journal.cpp>
test_framework = unity
extra_scripts = pre:tools/native_build.py
lib_deps =
    mini-etg-core=symlink://core
    mini-etg-sim=symlink://sim/shared
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -pedantic
    -Itest/support
    -Ifirmware/src


[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.partitions = firmware/partitions.csv
extra_scripts = post:firmware/merge_image.py
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
monitor_speed = 115200
lib_deps =
    mini-etg-core=symlink://core
    adafruit/Adafruit SSD1306@2.5.15
